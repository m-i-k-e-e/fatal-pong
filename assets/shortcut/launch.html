<!doctype html>
<!-- Opened by the Fatal Pong home screen tile (sce_sys/param.json deeplinkUri), served by websrv: asks websrv to
     start the game the way its Homebrew Launcher does. Installed by installer.c. -->
<html>
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="data:,">
    <style>
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center;
             justify-content: center; background: #0b0506; color: #eee; font: bold 32px sans-serif; }
      img { width: 256px; height: 256px; margin-bottom: 32px; }
      #error { color: #e33; font-size: 24px; margin-top: 16px; }
    </style>
  </head>
  <body>
    <img src="sce_sys/icon0.png" alt="">
    <div id="status">Starting Fatal Pong&hellip;</div>
    <div id="error"></div>
    <script>
      const dir = "/user/app/PONG00001";
      const params = new URLSearchParams({ path: dir + "/eboot.elf", cwd: dir, pipe: "0", daemon: "0" });
      fetch("/hbldr?" + params).then(response => {
        if (!response.ok) throw new Error("websrv answered " + response.status);
      }).catch(err => {
        document.getElementById("status").textContent = "Fatal Pong didn't start";
        document.getElementById("error").textContent = err.message;
      });
    </script>
  </body>
</html>
